<script>
  /**
   * App — contrôleur du wizard.
   * Gère l'état partagé et les transitions d'étapes (verrouillage / déverrouillage).
   * Fournit aussi les helpers UI partagés entre les modules (search, spinner…).
   */
  const App = {

    /** État partagé entre les étapes. */
    state: {
      source:      null,  // { type: 'drive'|'local', id|content, name }
      fields:      [],    // string[] — champs sélectionnés
      destination: null,  // objet de config destination
    },

    /**
     * Déverrouille un panneau et fait défiler la page vers lui.
     * @param {number} stepNumber
     */
    unlockStep: function (stepNumber) {
      const panel = document.getElementById('panel-' + stepNumber);
      if (!panel) return;
      panel.classList.remove('locked');
      panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    },

    /**
     * Verrouille un panneau — inverse symétrique de unlockStep.
     * @param {number} stepNumber
     */
    lockStep: function (stepNumber) {
      const panel = document.getElementById('panel-' + stepNumber);
      if (panel) panel.classList.add('locked');
    },

    /**
     * Verrouille toutes les étapes à partir de stepNumber et vide l'état en cascade.
     * À appeler quand la source est effacée (reset complet du wizard depuis step 2).
     * @param {number} stepNumber - Première étape à verrouiller (2 ou 3)
     */
    resetDownstreamOf: function (stepNumber) {
      for (let n = stepNumber; n <= 3; n++) App.lockStep(n);
      if (stepNumber <= 2) {
        App.state.fields = [];
        App.state.destination = null;
        document.getElementById('fields-list').innerHTML = '';
        document.getElementById('fields-status').className = 'hidden';
        document.getElementById('btn-to-step3').classList.add('hidden');
        document.getElementById('panel-2-desc').classList.remove('hidden');
        document.getElementById('destination-options').innerHTML = '';
        document.getElementById('conversion-zone').innerHTML = '';
      }
      if (stepNumber === 3) {
        App.state.destination = null;
        document.getElementById('destination-options').innerHTML = '';
        document.getElementById('conversion-zone').innerHTML = '';
      }
    },

    /**
     * Efface l'affichage de la source non active.
     * Garantit l'exclusivité mutuelle entre Drive Search et Upload local.
     * @param {'drive'|'local'} keepType - Source à conserver
     */
    clearOtherSource: function (keepType) {
      if (keepType !== 'local') {
        document.getElementById('local-selected').classList.add('hidden');
        document.getElementById('local-selected-name').textContent = '';
        document.getElementById('local-file-input').value = '';
      }
      if (keepType !== 'drive') {
        document.getElementById('drive-selected').classList.add('hidden');
        document.getElementById('drive-selected-name').textContent = '';
        document.getElementById('drive-search-input').value = '';
        DriveSearch._hideDropdown();
      }
    },

    // ── Helpers UI partagés (search widgets) ──

    /**
     * Affiche une liste de résultats Drive dans un <ul> existant.
     * @param {string} listId
     * @param {{ id: string, name: string }[]} results
     * @param {function} onSelect  Appelée avec l'objet fichier sélectionné
     * @param {function} onEmpty   Appelée quand results est vide
     */
    renderSearchResults: function (listId, results, onSelect, onEmpty) {
      const list = document.getElementById(listId);
      list.innerHTML = '';
      if (!results.length) { onEmpty(); return; }
      results.forEach(function (file) {
        const li = document.createElement('li');
        li.className = 'result-item';
        li.setAttribute('role', 'option');
        li.textContent = file.name;
        li.addEventListener('click', function () { onSelect(file); });
        list.appendChild(li);
      });
      list.classList.remove('hidden');
    },

    hideSearchDropdown: function (resultsId, messageId) {
      document.getElementById(resultsId).classList.add('hidden');
      document.getElementById(messageId).classList.add('hidden');
    },

    showSearchMessage: function (messageId, msg) {
      const el = document.getElementById(messageId);
      el.textContent = msg;
      el.classList.remove('hidden');
    },

    setSpinner: function (spinnerId, show) {
      document.getElementById(spinnerId).classList.toggle('hidden', !show);
    },
  };
</script>
