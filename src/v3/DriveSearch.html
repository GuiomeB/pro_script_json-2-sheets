<script>
  /**
   * DriveSearch — recherche de fichiers JSON dans le Drive de l'utilisateur.
   * Appelle searchDriveJsonFiles() côté serveur via google.script.run.
   */
  const DriveSearch = {
    _timer: null,

    init: function () {
      document.getElementById('drive-search-input')
        .addEventListener('input', function () { DriveSearch._onInput(this.value); });
      document.getElementById('drive-clear-btn')
        .addEventListener('click', DriveSearch._reset);
    },

    _onInput: function (value) {
      clearTimeout(DriveSearch._timer);
      DriveSearch._hideDropdown();
      const trimmed = value.trim();
      if (trimmed.length < 2) return;
      // URL Drive ou ID collé → résolution directe (pas de recherche par nom).
      if (DriveSearch._looksLikeDriveRef(trimmed)) {
        DriveSearch._resolveUrl(trimmed);
        return;
      }
      // Sinon : recherche par nom après 300 ms d'inactivité (debounce).
      DriveSearch._timer = setTimeout(function () {
        DriveSearch._search(trimmed);
      }, 300);
    },

    /** Détecte une URL Drive/Docs ou un ID brut (segment de 25+ caractères). */
    _looksLikeDriveRef: function (value) {
      return /drive\.google\.com|docs\.google\.com/i.test(value) || /[-\w]{25,}/.test(value);
    },

    _resolveUrl: function (value) {
      DriveSearch._setSpinner(true);
      google.script.run
        .withSuccessHandler(function (file) {
          DriveSearch._setSpinner(false);
          DriveSearch._select(file);
        })
        .withFailureHandler(function (error) {
          DriveSearch._setSpinner(false);
          DriveSearch._showMessage(error.message || 'Impossible de résoudre ce lien.');
        })
        .resolveDriveFile(value);
    },

    _search: function (term) {
      DriveSearch._setSpinner(true);
      google.script.run
        .withSuccessHandler(DriveSearch._render)
        .withFailureHandler(function () {
          DriveSearch._setSpinner(false);
          DriveSearch._showMessage('Impossible d\'accéder à votre Drive. Rechargez la page et réessayez.');
        })
        .searchDriveJsonFiles(term);
    },

    _render: function (results) {
      DriveSearch._setSpinner(false);
      App.renderSearchResults(
        'drive-search-results',
        results,
        DriveSearch._select,
        function () {
          DriveSearch._showMessage('Aucun fichier JSON trouvé. Essayez l\'option "Depuis mon ordinateur" ci-dessous.');
        }
      );
    },

    _select: function (file) {
      App.clearOtherSource('drive');
      App.state.source = { type: 'drive', id: file.id, name: file.name };
      document.getElementById('drive-search-input').value = '';
      DriveSearch._hideDropdown();
      document.getElementById('drive-selected-name').textContent = file.name;
      document.getElementById('drive-selected').classList.remove('hidden');
      App.unlockStep(2);
      AnalyseJson.run(App.state.source);
    },

    _reset: function () {
      App.state.source = null;
      document.getElementById('drive-selected').classList.add('hidden');
      document.getElementById('drive-selected-name').textContent = '';
      App.resetDownstreamOf(2);
    },

    _hideDropdown: function () {
      App.hideSearchDropdown('drive-search-results', 'drive-search-message');
    },

    _setSpinner: function (show) {
      App.setSpinner('drive-search-spinner', show);
    },

    _showMessage: function (msg) {
      App.showSearchMessage('drive-search-message', msg);
    },
  };
</script>
